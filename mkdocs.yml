site_name: EVE Online Streamer

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - producer/src
            - processor/src
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Stream processor: processor.md
  - API Reference:
      - Producer: api/producer.md
