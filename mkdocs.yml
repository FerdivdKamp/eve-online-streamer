site_name: EVE Online Streamer

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - producer/src
            - consumer/src
            - processor/src
          options:
            docstring_style: google
            show_source: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Redpanda: redpanda.md
  - Stream processor: processor.md
  - Monitoring: monitoring.md
  - Demo scenarios: demo.md
  - Python Reference:
      - Producer: api/producer.md
      - Consumer: api/consumer.md
      - Processor: api/processor.md
