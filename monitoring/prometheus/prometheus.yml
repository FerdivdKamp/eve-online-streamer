global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
